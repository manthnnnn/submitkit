<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SubmitKit Logo Explorations</title>
  <style>
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
      max-width: 1000px;
      width: 100%;
    }
    .card {
      background: #121216;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .title {
      font-size: 14px;
      font-weight: 600;
      color: #a1a1aa;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .preview-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: 100%;
      justify-content: center;
    }
    .wordmark {
      font-family: "Space Grotesk", sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .favicon-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #202124;
      padding: 6px 14px;
      border-radius: 8px 8px 0 0;
      font-size: 12px;
      color: #e8eaed;
      border-bottom: 2px solid #6366f1;
    }
  </style>
</head>
<body>
  <h1>SubmitKit Brand Mark Concepts</h1>
  <div class="grid">
    
    <!-- Option 1: The Isometric Submission Cube / Kit -->
    <div class="card">
      <div class="title">Option 1: The Apex Kit (Isometric Cube + Launch Chevron)</div>
      <div class="preview-row">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="topG1" x1="8" y1="12" x2="32" y2="12" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38bdf8" />
              <stop offset="1" stop-color="#10b981" />
            </linearGradient>
            <linearGradient id="leftG1" x1="8" y1="18" x2="20" y2="34" gradientUnits="userSpaceOnUse">
              <stop stop-color="#6366f1" />
              <stop offset="1" stop-color="#4338ca" />
            </linearGradient>
            <linearGradient id="rightG1" x1="20" y1="18" x2="32" y2="34" gradientUnits="userSpaceOnUse">
              <stop stop-color="#06b6d4" />
              <stop offset="1" stop-color="#0f766e" />
            </linearGradient>
            <filter id="glow1" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
              <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.3" />
            </filter>
          </defs>
          <g filter="url(#glow1)">
            <!-- Top diamond face -->
            <path d="M20 5L33 12.5L20 20L7 12.5L20 5Z" fill="url(#topG1)" />
            <!-- Left vertical face -->
            <path d="M7 14L19 20.8V34.5L7 27.8V14Z" fill="url(#leftG1)" opacity="0.95" />
            <!-- Right vertical face -->
            <path d="M21 20.8L33 14V27.8L21 34.5V20.8Z" fill="url(#rightG1)" />
            <!-- Subtle white apex line -->
            <path d="M20 9L27 13L20 17L13 13L20 9Z" fill="white" fill-opacity="0.25" />
          </g>
        </svg>
        <span class="wordmark">Submit<span style="color:#10b981;">Kit</span></span>
      </div>
      <div class="favicon-preview">
        <svg width="16" height="16" viewBox="0 0 40 40" fill="none">
          <path d="M20 5L33 12.5L20 20L7 12.5L20 5Z" fill="#10b981" />
          <path d="M7 14L19 20.8V34.5L7 27.8V14Z" fill="#6366f1" />
          <path d="M21 20.8L33 14V27.8L21 34.5V20.8Z" fill="#06b6d4" />
        </svg>
        <span>SubmitKit - Tab Preview</span>
      </div>
    </div>

    <!-- Option 2: The Interlocking Geometric "S" Monogram -->
    <div class="card">
      <div class="title">Option 2: The Interlocking Modern "S" Glyph</div>
      <div class="preview-row">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="sg1" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#818cf8" />
              <stop offset="0.5" stop-color="#6366f1" />
              <stop offset="1" stop-color="#10b981" />
            </linearGradient>
            <linearGradient id="sg2" x1="36" y1="4" x2="4" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#38bdf8" />
              <stop offset="1" stop-color="#059669" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="#18181b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
          <!-- S Upper Ribbon -->
          <path d="M27 10H15C12.2386 10 10 12.2386 10 15C10 17.7614 12.2386 20 15 20H25C27.7614 20 30 22.2386 30 25C30 27.7614 27.7614 30 25 30H13" stroke="url(#sg1)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Upward Submit Indicator dot -->
          <circle cx="28" cy="11" r="2" fill="#34d399" />
        </svg>
        <span class="wordmark">Submit<span style="background:linear-gradient(135deg, #818cf8, #34d399); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Kit</span></span>
      </div>
      <div class="favicon-preview">
        <svg width="16" height="16" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#18181b" />
          <path d="M27 10H15C12.2386 10 10 12.2386 10 15C10 17.7614 12.2386 20 15 20H25C27.7614 20 30 22.2386 30 25C30 27.7614 27.7614 30 25 30H13" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>SubmitKit - Tab Preview</span>
      </div>
    </div>

    <!-- Option 3: The Precision High-Tech Hex-Kit -->
    <div class="card">
      <div class="title">Option 3: The Hex-Prism (Engineering & Code)</div>
      <div class="preview-row">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hexBg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#1e1b4b" />
              <stop offset="1" stop-color="#064e3b" />
            </linearGradient>
            <linearGradient id="hexLine" x1="6" y1="6" x2="34" y2="34" gradientUnits="userSpaceOnUse">
              <stop stop-color="#818cf8" />
              <stop offset="0.5" stop-color="#38bdf8" />
              <stop offset="1" stop-color="#34d399" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="10" fill="url(#hexBg)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
          <!-- Code bracket + checkmark combination -->
          <path d="M14 16L9 20L14 24" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M26 16L31 20L26 24" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M17 21L20 24L25 15" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="wordmark">Submit<span style="color:#fafafa;">Kit</span><span style="color:#10b981;">.</span></span>
      </div>
      <div class="favicon-preview">
        <svg width="16" height="16" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#1e1b4b" />
          <path d="M14 16L9 20L14 24" stroke="#818cf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M26 16L31 20L26 24" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M17 21L20 24L25 15" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>SubmitKit - Tab Preview</span>
      </div>
    </div>

  </div>
</body>
</html>
