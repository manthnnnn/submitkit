<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" role="img" aria-labelledby="title desc">
  <title id="title">SubmitKit project setup guide</title>
  <desc id="desc">A warm, clean illustration of a project bundle ready to launch.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F1"/>
      <stop offset="1" stop-color="#F2EEE4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#183B3A" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1376" height="768" fill="url(#paper)"/>
  <circle cx="1260" cy="90" r="190" fill="#E5F1E9" opacity=".7"/>
  <circle cx="84" cy="724" r="160" fill="#F2E8D7" opacity=".75"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <rect x="88" y="66" width="44" height="44" rx="13" fill="#0D9488"/>
    <path d="M101 88h18M110 79v18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="148" y="96" fill="#153B3A" font-size="23" font-weight="800">SubmitKit</text>
    <text x="88" y="196" fill="#0D8077" font-size="16" font-weight="750" letter-spacing="2">YOUR PROJECT SETUP GUIDE</text>
    <text x="88" y="278" fill="#173B3A" font-size="58" font-weight="780">Your project,</text>
    <text x="88" y="347" fill="#173B3A" font-size="58" font-weight="780">ready to run.</text>
    <text x="88" y="404" fill="#526B68" font-size="22" font-weight="450">Follow along from download to first launch.</text>

    <g filter="url(#shadow)">
      <rect x="718" y="132" width="572" height="386" rx="24" fill="#173B3A"/>
      <rect x="735" y="149" width="538" height="352" rx="13" fill="#FBFCFA"/>
      <path d="M748 149h512a13 13 0 0 1 13 13v37H735v-37a13 13 0 0 1 13-13Z" fill="#F0F4EF"/>
      <circle cx="759" cy="171" r="5" fill="#E58B76"/>
      <circle cx="778" cy="171" r="5" fill="#E8BD64"/>
      <circle cx="797" cy="171" r="5" fill="#69B99C"/>
      <text x="825" y="177" fill="#69817B" font-size="13" font-weight="650">PROJECT BUNDLE</text>

      <rect x="760" y="223" width="205" height="246" rx="12" fill="#F7F8F5" stroke="#E5EBE5"/>
      <text x="782" y="256" fill="#234441" font-size="14" font-weight="750">YOUR FILES</text>
      <g font-size="13" font-weight="560" fill="#405C57">
        <rect x="780" y="275" width="164" height="37" rx="8" fill="#EAF5F0"/>
        <rect x="793" y="286" width="14" height="14" rx="3" fill="#0D9488"/>
        <path d="M797 293h6m-3-3v6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <text x="817" y="298">Source code</text>
        <rect x="793" y="328" width="14" height="14" rx="3" fill="#D8E8E1"/>
        <path d="M796 333h8m-8 3h8" stroke="#4A7A6F" stroke-width="1.4" stroke-linecap="round"/>
        <text x="817" y="341">Documentation</text>
        <rect x="793" y="371" width="14" height="14" rx="3" fill="#D8E8E1"/>
        <path d="M796 376h8m-8 3h8" stroke="#4A7A6F" stroke-width="1.4" stroke-linecap="round"/>
        <text x="817" y="384">Setup notes</text>
      </g>

      <rect x="984" y="223" width="265" height="246" rx="12" fill="#F4F8F4"/>
      <text x="1007" y="256" fill="#234441" font-size="14" font-weight="750">READY TO START</text>
      <rect x="1007" y="279" width="219" height="57" rx="9" fill="#FFFFFF" stroke="#E3EAE4"/>
      <circle cx="1031" cy="307" r="12" fill="#E5F3ED"/>
      <path d="m1026 307 4 4 7-8" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1052" y="304" fill="#234441" font-size="13" font-weight="700">Download the bundle</text>
      <text x="1052" y="322" fill="#768B84" font-size="11">Files saved to your device</text>
      <rect x="1007" y="347" width="219" height="57" rx="9" fill="#FFFFFF" stroke="#E3EAE4"/>
      <circle cx="1031" cy="375" r="12" fill="#E5F3ED"/>
      <path d="m1026 375 4 4 7-8" fill="none" stroke="#0D9488" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1052" y="372" fill="#234441" font-size="13" font-weight="700">Open the project</text>
      <text x="1052" y="390" fill="#768B84" font-size="11">See your work come to life</text>
      <rect x="1007" y="415" width="132" height="34" rx="8" fill="#0D9488"/>
      <text x="1025" y="437" fill="#FFFFFF" font-size="12" font-weight="720">Start setup</text>
      <path d="m1120 427 5 5-5 5" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M685 518h638l-36 28H720z" fill="#244947"/>
      <path d="M704 519h600l-27 19H731z" fill="#DDE8E1"/>
      <rect x="973" y="521" width="76" height="3" rx="2" fill="#B5C8BE"/>
    </g>

    <rect x="88" y="641" width="288" height="58" rx="29" fill="#FFFFFF" stroke="#DCE8DF"/>
    <circle cx="119" cy="670" r="17" fill="#0D9488"/>
    <path d="m115 661 14 9-14 9z" fill="#FFFFFF"/>
    <text x="150" y="676" fill="#234441" font-size="15" font-weight="750">WATCH THE WALKTHROUGH</text>
    <text x="1250" y="677" text-anchor="end" fill="#70847D" font-size="14" font-weight="650">02:36</text>
  </g>
</svg>